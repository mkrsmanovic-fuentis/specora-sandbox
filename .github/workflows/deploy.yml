name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx ng build --configuration production --base-href=/specora-sandbox/

      # SPA fallback so deep links (e.g. /inventory/information/IA-001) work on Pages.
      - name: Add 404 fallback
        run: cp dist/specora-sandbox/browser/index.html dist/specora-sandbox/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/specora-sandbox/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
