name: Deploy to GitHub Pages

# Single source of truth for deploying the built Angular app to GitHub Pages.
# IMPORTANT: this only takes effect when repo Settings > Pages > Source is set
# to "GitHub Actions" (NOT "Deploy from a branch"). With "Deploy from a branch"
# GitHub serves the repo root and renders README.md via Jekyll instead of the app.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # base-href must match the project-page path: /<repo-name>/
      - name: Build
        run: npx ng build --configuration production --base-href=/specora-sandbox/

      - name: Prepare Pages artifact
        run: |
          # SPA deep-link fallback (e.g. /inventory/information/IA-001).
          cp dist/specora-sandbox/browser/index.html dist/specora-sandbox/browser/404.html
          # Disable Jekyll so the app's files are served verbatim.
          touch dist/specora-sandbox/browser/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/specora-sandbox/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
